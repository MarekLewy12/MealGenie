<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>MealGenie — Three Visual Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..700;1,300..700&family=Inter:wght@400;500;600;700&family=Caveat:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#1a1410;font-family:Inter,system-ui,sans-serif;}
  *{box-sizing:border-box}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="directions/shared.jsx"></script>
<script type="text/babel" src="directions/direction-a.jsx"></script>
<script type="text/babel" src="directions/direction-b.jsx"></script>
<script type="text/babel" src="directions/direction-c.jsx"></script>

<script type="text/babel" data-presets="react">
const App = () => (
  <DesignCanvas title="MealGenie — Three Visual Directions">
    <DCSection id="dir-a" title="Direction A — Cozy Polish home kitchen" subtitle="Warm, comforting, familiar. Cookbook serif, terracotta, folk-pattern accents, handwritten kicker.">
      <DCArtboard id="a-landing" label="Landing hero" width={1280} height={760}><A_LandingHero/></DCArtboard>
      <DCArtboard id="a-dash" label="Dashboard" width={1280} height={760}><A_Dashboard/></DCArtboard>
      <DCArtboard id="a-gen" label="Meal generator" width={1280} height={760}><A_Generator/></DCArtboard>
      <DCArtboard id="a-sugg" label="Meal suggestions" width={1280} height={760}><A_Suggestions/></DCArtboard>
      <DCArtboard id="a-recipe" label="Full recipe" width={1280} height={760}><A_Recipe/></DCArtboard>
      <DCArtboard id="a-chat" label="Chat assistant drawer" width={1280} height={760}><A_Chat/></DCArtboard>
      <DCArtboard id="a-mobile" label="Mobile" width={760} height={760}><A_Mobile/></DCArtboard>
    </DCSection>

    <DCSection id="dir-b" title="Direction B — Premium AI chef" subtitle="Editorial restraint, monochrome with refined saffron accent, large refined serif, generous whitespace.">
      <DCArtboard id="b-landing" label="Landing hero" width={1280} height={760}><B_LandingHero/></DCArtboard>
      <DCArtboard id="b-dash" label="Dashboard" width={1280} height={760}><B_Dashboard/></DCArtboard>
      <DCArtboard id="b-gen" label="Meal generator" width={1280} height={760}><B_Generator/></DCArtboard>
      <DCArtboard id="b-sugg" label="Meal suggestions" width={1280} height={760}><B_Suggestions/></DCArtboard>
      <DCArtboard id="b-recipe" label="Full recipe" width={1280} height={760}><B_Recipe/></DCArtboard>
      <DCArtboard id="b-chat" label="Chat assistant drawer" width={1280} height={760}><B_Chat/></DCArtboard>
      <DCArtboard id="b-mobile" label="Mobile" width={760} height={760}><B_Mobile/></DCArtboard>
    </DCSection>

    <DCSection id="dir-c" title="Direction C — Magical culinary assistant" subtitle="Night-sky palette, glowing genie blob, sparkle accents, gradient fire-type. Playful but not childish.">
      <DCArtboard id="c-landing" label="Landing hero" width={1280} height={760}><C_LandingHero/></DCArtboard>
      <DCArtboard id="c-dash" label="Dashboard" width={1280} height={760}><C_Dashboard/></DCArtboard>
      <DCArtboard id="c-gen" label="Meal generator" width={1280} height={760}><C_Generator/></DCArtboard>
      <DCArtboard id="c-sugg" label="Meal suggestions" width={1280} height={760}><C_Suggestions/></DCArtboard>
      <DCArtboard id="c-recipe" label="Full recipe" width={1280} height={760}><C_Recipe/></DCArtboard>
      <DCArtboard id="c-chat" label="Chat assistant drawer" width={1280} height={760}><C_Chat/></DCArtboard>
      <DCArtboard id="c-mobile" label="Mobile" width={760} height={760}><C_Mobile/></DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
